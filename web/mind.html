<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mind &amp; Routine</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b6169">
<link rel="icon" href="icon-192.png">
<!--
  Mind & Routine -- mental health check-in + daily routine, offline, in Chrome.
  One file, no internet, no server: works after Termux is closed.
  Data lives in this browser (localStorage) and can be saved/loaded as JSON.
  `mind import` in Termux copies a saved JSON into ~/.wake/mental.log.
  Requested: "help me with mental health check and routine to make it work
  into json offline chrome and stay open there after closing termux".
  Design: gray + light blue (locked 2026-09-02), 8 boxes on the main screen,
  every time shown to the millisecond.
-->
<style>
:root{--bg:#4a5058;--panel:#5b6169;--panel2:#666d76;--line:#838a94;--ink:#f2f4f6;--dim:#c7ccd3;--accent:#8ecae6;--bad:#d99a94;--good:#a8c9a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
/* locked to the screen: header + the rest, no page zoom; the home grid fills exactly what is left */
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
#clock{font:13px ui-monospace,monospace;color:var(--dim)}
main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 90px;width:100%;max-width:720px;margin:0 auto}
main.fit{overflow:hidden;padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-width:none}
.grid8{display:grid;gap:10px;height:100%;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
@media (orientation:landscape){.grid8{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}}
.box{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer;user-select:none}
.box b{font-size:clamp(20px,5vh,34px);color:var(--accent)}
.box span{font-size:16px}
.box small{color:var(--dim);font-size:12px;margin-top:4px}
.box.empty{opacity:.35;cursor:default}
.box.help b{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px;cursor:pointer}
.btn.pri{background:var(--accent);color:#1d2a31;border-color:var(--accent);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.feel{flex:1 1 30%;min-width:96px;padding:14px 6px}
.feel.on{outline:3px solid var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px}
.stamp{font:12px ui-monospace,monospace;color:var(--dim)}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:24px;height:24px;accent-color:var(--accent)}
.item label{flex:1}
.done label{color:var(--good)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
h2{font-size:16px;margin:4px 0 10px}
h3{font-size:14px;margin:10px 0 4px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
nav.back.hide{display:none}
nav.back{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px}
nav.back .btn{flex:1}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--accent);color:#1d2a31;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
a{color:var(--accent)}
.hide{display:none}
</style>
</head>
<body>
<header><h1 id="title">Mind &amp; Routine</h1><span id="clock"></span></header>
<main id="view"></main>
<nav class="back hide" id="nav"><button class="btn" id="backBtn">7 · back</button></nav>
<div id="toast"></div>

<script id="seed" type="application/json">[]</script>
<script>
"use strict";
const KEY = "mind.v1";
const FEELS = [
  {k:"great", label:"Great", score:5}, {k:"good", label:"Good", score:4},
  {k:"okay", label:"Okay", score:3}, {k:"low", label:"Not great", score:2},
  {k:"bad", label:"Bad", score:1}, {k:"help", label:"Need help", score:0}
];
const DEFAULT_ROUTINE = [
  {id:"r1", name:"Drink a glass of water", part:"morning"},
  {id:"r2", name:"Eat something", part:"morning"},
  {id:"r3", name:"Wash up / shower", part:"morning"},
  {id:"r4", name:"Write what I'm doing today", part:"morning"},
  {id:"r5", name:"Get outside 10 minutes", part:"day"},
  {id:"r6", name:"Talk to someone", part:"day"},
  {id:"r7", name:"Eat a real meal", part:"evening"},
  {id:"r8", name:"Screens down before bed", part:"evening"}
];

// ---------- full timestamps, to the millisecond ----------
const p2 = n => String(n).padStart(2, "0");
function stamp(ms){ const d = new Date(ms ?? Date.now());
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())+"."+String(d.getMilliseconds()).padStart(3,"0"); }
const dayKey = ms => stamp(ms).slice(0,10);
function rel(ms){ const m = Math.floor((Date.now()-ms)/60000);
  if (m < 1) return "just now"; if (m < 60) return m+" min ago";
  if (m < 2880) return Math.floor(m/60)+"h "+(m%60)+"m ago"; return Math.floor(m/1440)+" days ago"; }
const when = ms => stamp(ms)+" ("+rel(ms)+")";

// ---------- storage (never trusted to exist: private mode etc.) ----------
function blank(){ return {version:1, created:Date.now(), mental:[], routine:{items:DEFAULT_ROUTINE.slice(), days:{}}}; }
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ db = blank(); }
if (!db.routine) db.routine = {items:DEFAULT_ROUTINE.slice(), days:{}};
function save(){ db.saved = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch(e){ toast("Couldn't save in this browser -- use 6 Save JSON"); return false; } }

// ---------- tiny UI helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",2600); }
function show(title, html, back=true){ $("#title").textContent=title; $("#view").innerHTML=html; $("#view").classList.toggle("fit", !back); $("#nav").classList.toggle("hide",!back); window.scrollTo(0,0); current=title; }
let current = "";
setInterval(()=>{$("#clock").textContent=stamp();}, 47);

// ---------- 1-8 main screen ----------
function todayDone(){ const d=db.routine.days[dayKey()]||{}; return db.routine.items.filter(i=>d[i.id]).length; }
function home(){
  const last = db.mental[db.mental.length-1];
  const n = db.routine.items.length, done = todayDone();
  const boxes = [
    ["Check in", last ? "last: "+esc(FEELS.find(f=>f.k===last.feel)?.label||last.feel)+"<br>"+esc(rel(last.t)) : "not yet", checkin],
    ["Routine", done+" / "+n+" today", routine],
    ["History", db.mental.length+" check-ins", history],
    ["Help now", "988 · 911", help, "help"],
    ["Edit routine", n+" items", editRoutine],
    ["Save JSON", db.saved ? "saved "+esc(rel(db.saved)) : "", exportJson],
    ["Load JSON", "from a file", importJson],
    ["Notifications", ("Notification" in window) ? "Chrome: "+Notification.permission : "Chrome: not offered here", notifySetup]
  ];
  show("Mind & Routine", '<div class="grid8">'+boxes.map((b,i)=>
    '<div class="box'+(b[2]?"":" empty")+(b[3]?" "+b[3]:"")+'" data-i="'+i+'"><b>'+(i+1)+'</b><span>'+esc(b[0])+'</span><small>'+b[1]+'</small></div>').join("")+'</div>', false);
  document.querySelectorAll(".box").forEach(el=>{ const b=boxes[+el.dataset.i]; if(b[2]) el.onclick=b[2]; });
  homeKeys = boxes.map(b=>b[2]);
}
let homeKeys = [];
document.addEventListener("keydown", e=>{
  const t = e.target; if (t && t.closest && t.closest("input,textarea,select")) return;
  if (current==="Mind & Routine" && /^[1-8]$/.test(e.key) && homeKeys[+e.key-1]) homeKeys[+e.key-1]();
  else if (e.key==="7" || e.key==="Escape") home();
});
$("#backBtn").onclick = home;

// ---------- check-in ----------
function checkin(){
  let pick = null;
  show("Check in", '<div class="card"><h2>How are you feeling right now?</h2><div class="row">'+
    FEELS.map(f=>'<button class="btn feel'+(f.k==="help"?" bad":"")+'" data-k="'+f.k+'">'+f.label+'</button>').join("")+
    '</div></div><div class="card"><h2>In your own words (optional)</h2><textarea id="note" placeholder="What\'s going on? Anything is fine."></textarea>'+
    '<h3>Slept last night</h3><select id="sleep"><option value="">-</option><option>under 4 h</option><option>4-6 h</option><option>6-8 h</option><option>over 8 h</option></select></div>'+
    '<div class="row"><button class="btn pri" id="saveCk" style="flex:1">Save check-in</button></div>');
  document.querySelectorAll(".feel").forEach(b=>b.onclick=()=>{ pick=b.dataset.k;
    document.querySelectorAll(".feel").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#saveCk").onclick=()=>{
    const note=$("#note").value.trim();
    if(!pick && !note){ toast("Pick a feeling or write something"); return; }
    const f=FEELS.find(x=>x.k===pick);
    const e={t:Date.now(), feel:pick||"note", score:f?f.score:null, note, sleep:$("#sleep").value};
    e.stamp=stamp(e.t); db.mental.push(e); save();
    toast("Saved "+e.stamp);
    if (pick==="help" || pick==="bad") help(); else home();
  };
}

// ---------- help ----------
function help(){
  show("Help now", '<div class="card"><h2>You don\'t have to handle this alone.</h2>'+
    '<p>If you might hurt yourself or you\'re in danger, call now:</p><div class="row">'+
    '<a class="btn bad" style="flex:1;text-align:center" href="tel:988">Call 988</a>'+
    '<a class="btn bad" style="flex:1;text-align:center" href="sms:988">Text 988</a>'+
    '<a class="btn bad" style="flex:1;text-align:center" href="tel:911">Call 911</a></div>'+
    '<p class="stamp">988 = Suicide &amp; Crisis Lifeline (US), any hour. Outside the US: 112.</p></div>'+
    '<div class="card"><h2>Right now, try one small thing</h2><div class="item"><label>Breathe in 4 seconds, hold 4, out 6 -- five times</label></div>'+
    '<div class="item"><label>Drink some water</label></div><div class="item"><label>Message someone you trust: "can you talk?"</label></div>'+
    '<div class="item"><label>Change rooms or step outside for a minute</label></div></div>');
}

// ---------- routine ----------
function routine(){
  const k=dayKey(), day=db.routine.days[k]||(db.routine.days[k]={});
  const items=db.routine.items, n=items.length, done=items.filter(i=>day[i.id]).length;
  const parts=["morning","day","evening"];
  show("Routine", '<div class="card"><h2>Today '+k+' -- '+done+' / '+n+' ('+(n?Math.round(done*100/n):0)+'%)</h2><div class="bar"><i style="width:'+(n?done*100/n:0)+'%"></i></div></div>'+
    parts.map(p=>{ const its=items.filter(i=>(i.part||"day")===p); if(!its.length) return "";
      return '<div class="card"><h3>'+p+'</h3>'+its.map(i=>'<div class="item'+(day[i.id]?" done":"")+'"><input type="checkbox" id="c_'+i.id+'"'+(day[i.id]?" checked":"")+'><label for="c_'+i.id+'">'+esc(i.name)+
        (day[i.id]?'<br><span class="stamp">'+esc(stamp(day[i.id]))+'</span>':'')+'</label></div>').join("")+'</div>'; }).join(""));
  items.forEach(i=>{ const c=$("#c_"+i.id); if(c) c.onchange=()=>{ if(c.checked) day[i.id]=Date.now(); else delete day[i.id]; save(); routine(); }; });
}

function editRoutine(){
  const items=db.routine.items;
  show("Edit routine", '<div class="card"><h2>Your routine</h2>'+items.map((i,n)=>'<div class="item"><label>'+esc(i.name)+' <span class="stamp">('+esc(i.part||"day")+')</span></label><button class="btn" data-del="'+n+'">remove</button></div>').join("")+
    '</div><div class="card"><h2>Add one</h2><input type="text" id="newName" placeholder="e.g. Take my meds"><div class="row" style="margin-top:8px"><select id="newPart" style="flex:1"><option>morning</option><option selected>day</option><option>evening</option></select>'+
    '<button class="btn pri" id="addIt">Add</button></div></div><div class="row"><button class="btn" id="resetR">Back to the starting list</button></div>');
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ items.splice(+b.dataset.del,1); save(); editRoutine(); });
  $("#addIt").onclick=()=>{ const v=$("#newName").value.trim(); if(!v) return; items.push({id:"r"+Date.now(), name:v, part:$("#newPart").value}); save(); editRoutine(); };
  $("#resetR").onclick=()=>{ if(confirm("Replace your list with the starting 8? Your history stays.")){ db.routine.items=DEFAULT_ROUTINE.slice(); save(); editRoutine(); } };
}

// ---------- history ----------
function feelLabel(k){ return FEELS.find(f=>f.k===k)?.label || k; }
function history(){
  const ms=db.mental.slice().reverse().slice(0,60);
  const days=Object.keys(db.routine.days).sort().reverse().slice(0,14);
  show("History", '<div class="card"><h2>Check-ins <span class="stamp">(tap one to edit)</span></h2>'+(ms.map(e=>'<div class="item" data-t="'+e.t+'" style="cursor:pointer"><label><b>'+esc(feelLabel(e.feel))+'</b>'+(e.sleep?' · slept '+esc(e.sleep):'')+
      (e.note?'<br>'+esc(e.note):'')+'<br><span class="stamp">'+esc(when(e.t))+(e.edits&&e.edits.length?' · edited '+esc(stamp(e.edits[e.edits.length-1].t)):'')+'</span></label><span>edit ›</span></div>').join("")||"<p>none yet</p>")+
    '</div><div class="card"><h2>Routine by day</h2>'+(days.map(d=>{ const c=Object.keys(db.routine.days[d]).length; return '<div class="item"><label>'+d+'</label><span>'+c+' done</span></div>'; }).join("")||"<p>none yet</p>")+'</div>');
  document.querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>editEntry(+el.dataset.t));
}

// Edit a past check-in. Gabe's rule (merge-provenance): never silently
// replace -- every earlier version stays in e.edits with when it changed.
function editEntry(t){
  const e=db.mental.find(x=>x.t===t); if(!e){ history(); return; }
  let pick=e.feel;
  const prev=(e.edits||[]).slice().reverse();
  show("Edit check-in", '<div class="card"><h2>Check-in from '+esc(stamp(e.t))+'</h2><div class="row">'+
    FEELS.map(f=>'<button class="btn feel'+(f.k==="help"?" bad":"")+(f.k===pick?" on":"")+'" data-k="'+f.k+'">'+f.label+'</button>').join("")+
    '</div></div><div class="card"><h2>Note</h2><textarea id="note">'+esc(e.note||"")+'</textarea>'+
    '<h3>Slept</h3><select id="sleep">'+["","under 4 h","4-6 h","6-8 h","over 8 h"].map(o=>'<option value="'+o+'"'+((e.sleep||"")===o?" selected":"")+'>'+(o||"-")+'</option>').join("")+'</select></div>'+
    '<div class="row"><button class="btn pri" id="saveEd" style="flex:2">Save changes</button><button class="btn bad" id="delEd" style="flex:1">Delete</button></div>'+
    (prev.length?'<div class="card" style="margin-top:12px"><h2>Earlier versions (kept)</h2>'+prev.map(v=>'<div class="item"><label><b>'+esc(feelLabel(v.before.feel))+'</b>'+(v.before.sleep?' · slept '+esc(v.before.sleep):'')+(v.before.note?'<br>'+esc(v.before.note):'')+
      '<br><span class="stamp">replaced '+esc(stamp(v.t))+'</span></label></div>').join("")+'</div>':''));
  document.querySelectorAll(".feel").forEach(b=>b.onclick=()=>{ pick=b.dataset.k; document.querySelectorAll(".feel").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#saveEd").onclick=()=>{
    const after={feel:pick, note:$("#note").value.trim(), sleep:$("#sleep").value};
    if(after.feel===e.feel && after.note===(e.note||"") && after.sleep===(e.sleep||"")){ history(); return; }
    (e.edits=e.edits||[]).push({t:Date.now(), before:{feel:e.feel, note:e.note||"", sleep:e.sleep||""}});
    const f=FEELS.find(x=>x.k===after.feel);
    Object.assign(e, after, {score: f ? f.score : e.score});
    save(); toast("Saved -- earlier version kept"); history();
  };
  $("#delEd").onclick=()=>{
    if(!confirm("Delete this check-in from "+stamp(e.t)+"?\n(It also won't come back from Termux.)")) return;
    db.mental=db.mental.filter(x=>x!==e);
    (db.deleted=db.deleted||[]).push({t:e.t, at:Date.now(), entry:e});   // kept aside, labeled, never just gone
    save(); toast("Deleted"); history();
  };
}

// ---------- Chrome notifications (box 8) ----------
// Asked for: "a button to ask for that page explicit chrome push notify".
// Honest limits, shown on screen: Android Chrome only shows web-page
// notifications through a service worker, which needs an https page --
// a page opened from a file (file:// or content://) can't register one.
function notifySetup(){
  const has = "Notification" in window, sw = "serviceWorker" in navigator, sec = !!window.isSecureContext;
  const lines = [
    ["This page's address", location.protocol + "//"],
    ["Secure (https) page", sec ? "yes" : "no"],
    ["Notification support", has ? "yes" : "no"],
    ["Permission", has ? Notification.permission : "-"],
    ["Service worker (needed on Android)", sw && sec ? "possible" : "not possible here"]
  ];
  show("Notifications", '<div class="card"><h2>Chrome notifications</h2>'+
    lines.map(l=>'<div class="item"><label>'+esc(l[0])+'</label><span>'+esc(l[1])+'</span></div>').join("")+
    '</div><div class="row"><button class="btn pri" id="askN" style="flex:1">Ask Chrome for permission</button><button class="btn" id="testN" style="flex:1">Send a test</button></div>'+
    '<div class="card" style="margin-top:12px" id="nres"><p class="stamp">Press "Ask" first. The result shows here.</p></div>'+
    '<div class="card"><h2>Check-in reminders</h2><p class="stamp">Status: <span id="remSt">'+esc(remindStatus())+'</span></p><div class="row">'+
    '<button class="btn" id="remOn" style="flex:1">Turn on</button><button class="btn" id="remOff" style="flex:1">Turn off</button></div>'+
    '<p class="stamp">While this app is open (or in the background): every 3 h. When it is fully closed, Chrome decides -- at most about twice a day, and only once the app is installed (Add to Home screen) and used regularly.</p></div>'+
    '<div class="card"><h2>Reminders that always work</h2><p>Termux already sends real phone notifications: <code>track remind on</code> '+
    '(mood / productivity / goals) and the mental check / task reminders in <code>wake</code>.</p></div>');
  $("#remOn").onclick = async () => { const r = await remindersOn(); $("#remSt").textContent = r; };
  $("#remOff").onclick = async () => { const r = await remindersOff(); $("#remSt").textContent = r; };
  const res = t => { $("#nres").innerHTML = '<p>'+t+'</p><p class="stamp">'+esc(stamp())+'</p>'; };
  $("#askN").onclick = () => {
    if (!has) { res("Chrome doesn't offer notifications to this page (opened from a file). They need the page hosted on an https address."); return; }
    try {
      const p = Notification.requestPermission(r => res("Chrome answered: <b>"+esc(r)+"</b>"));
      if (p && p.then) p.then(r => { res("Chrome answered: <b>"+esc(r)+"</b>"); home(); notifySetup(); });
    } catch(e) { res("Chrome refused the request: "+esc(e.message)); }
  };
  $("#testN").onclick = async () => {
    if (!has || Notification.permission !== "granted") { res("No permission yet ("+(has?esc(Notification.permission):"not offered")+")."); return; }
    try {
      if (sw && sec) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) { await reg.showNotification("Mind & Routine", {body:"Test at "+stamp()}); res("Sent through the service worker."); return; }
      }
      new Notification("Mind & Routine", {body:"Test at "+stamp()}); res("Sent.");
    } catch(e) { res("Chrome blocked it: "+esc(e.message)+" -- on Android this needs the page on https with a service worker."); }
  };
}

// ---------- reminders (need https + service worker + permission) ----------
const REMIND_MS = 3 * 3600 * 1000;
let remindTimer = null;
function remindStatus(){
  if (!db.remind) return "off";
  return "on since " + stamp(db.remind.since) + (db.remind.periodic ? " (also when closed, if Chrome allows)" : " (while open)");
}
async function notifyNow(title, body){
  const reg = ("serviceWorker" in navigator) ? await navigator.serviceWorker.getRegistration() : null;
  if (reg) return reg.showNotification(title, {body, tag:"mind-checkin", icon:"icon-192.png"});
  return new Notification(title, {body});
}
function startRemindTimer(){
  clearInterval(remindTimer);
  if (!db.remind || !("Notification" in window) || Notification.permission !== "granted") return;
  remindTimer = setInterval(() => {
    const last = db.mental[db.mental.length-1];
    if (!last || Date.now() - last.t > REMIND_MS - 60000) notifyNow("Mind & Routine", "Time for a check-in? (" + stamp() + ")").catch(()=>{});
  }, 10 * 60 * 1000);
}
async function remindersOn(){
  if (!("Notification" in window)) return "can't -- this page has no notification support (open the https version)";
  if (Notification.permission !== "granted" && (await Notification.requestPermission()) !== "granted") return "can't -- Chrome permission is " + Notification.permission;
  db.remind = {since: Date.now(), periodic: false};
  try {
    const reg = await navigator.serviceWorker.ready;
    if (reg.periodicSync) { await reg.periodicSync.register("mind-checkin", {minInterval: 12 * 3600 * 1000}); db.remind.periodic = true; }
  } catch(e) { /* Chrome said no to background checks -- timer still works while open */ }
  save(); startRemindTimer(); return remindStatus();
}
async function remindersOff(){
  delete db.remind; save(); clearInterval(remindTimer);
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg && reg.periodicSync) await reg.periodicSync.unregister("mind-checkin"); } catch(e) {}
  return "off";
}
startRemindTimer();

// ---------- JSON in / out ----------
function exportJson(){
  db.exported=Date.now(); save();
  const blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="mind-"+stamp().replace(/[: ]/g,"-")+".json"; document.body.appendChild(a); a.click(); a.remove();
  toast("Saved to Downloads: "+a.download); home();
}
function importJson(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; f.text().then(t=>{
    let d; try{ d=JSON.parse(t); }catch(e){ toast("Not a valid JSON file"); return; }
    if(!d || !Array.isArray(d.mental)){ toast("Not a Mind & Routine file"); return; }
    // merge, never overwrite: keep every check-in from both, routine days combined
    const seen=new Set(db.mental.map(e=>e.t).concat((db.deleted||[]).map(x=>x.t))); let added=0;
    d.mental.forEach(e=>{ if(!seen.has(e.t)){ db.mental.push(e); added++; } }); db.mental.sort((a,b)=>a.t-b.t);
    Object.entries((d.routine||{}).days||{}).forEach(([k,v])=>{ db.routine.days[k]=Object.assign({},v,db.routine.days[k]||{}); });
    save(); toast("Merged: "+added+" new check-ins"); home(); }); };
  inp.click();
}

// ---------- seed: check-ins already saved in Termux (~/.wake/mental.log) ----------
// `mind` writes them into the <script id="seed"> block below each time it
// installs the page; merged here once, matched by exact ms time, never doubled.
try {
  const seed = JSON.parse(document.getElementById("seed").textContent || "[]");
  const seen = new Set(db.mental.map(e => e.t).concat((db.deleted||[]).map(d => d.t))); let added = 0;
  seed.forEach(e => { if (!seen.has(e.t)) { db.mental.push(e); added++; } });
  if (added) { db.mental.sort((a,b) => a.t - b.t); save(); setTimeout(() => toast("Loaded "+added+" check-in(s) from Termux"), 300); }
} catch(e) {}

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(e => console.log("sw:", e));
}
home();
</script>
